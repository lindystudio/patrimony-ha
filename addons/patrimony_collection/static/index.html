<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Patrimony Collection</title>
  <style>

    @import url("https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Source+Sans+3:wght@400;500;600&display=swap");
    :root {
      --ink: #1a1714;
      --paper: #f4efe6;
      --cream: #f3ead7;
      --gold: #c4a574;
      --gold-deep: #8f7350;
      --alert: #c4472a;
      --muted: #8a8378;
      --line: #2a2622;
      --bg: #12100e;
      --panel: #1c1916;
      --ok: #f3ead7;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 15px/1.45 "Source Sans 3", ui-sans-serif, system-ui, sans-serif;
      background: var(--bg);
      color: var(--cream);
    }
    .chrome {
      position: sticky; top: 0; z-index: 20;
      background: var(--bg);
    }
    .house-bar {
      padding: 12px 14px 10px;
    }
    .house-top {
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px;
    }
    .house-brand {
      display: flex; align-items: center; gap: 8px; min-width: 0;
    }
    .key-mark {
      display: block; width: 11px; height: 20px;
      color: var(--gold); flex: none;
    }
    .wordmark {
      font-size: 10px; font-weight: 500;
      letter-spacing: 0.34em; text-transform: uppercase;
      color: var(--cream); white-space: nowrap;
    }
    .head-actions {
      display: flex; align-items: center; gap: 10px; flex-shrink: 0;
    }
    .house-name {
      margin: 10px 0 0;
      font-family: Fraunces, Georgia, serif;
      font-size: 26px; font-weight: 500; letter-spacing: -0.015em;
      line-height: 1.12; color: var(--cream);
    }
    .house-meta {
      display: flex; flex-wrap: wrap; align-items: baseline;
      gap: 4px 12px; margin: 6px 0 0;
      color: var(--cream); opacity: .78;
    }
    .house-meta span[hidden], .house-meta span:empty { display: none; }
    #house_place {
      font-size: 10px; letter-spacing: .16em; text-transform: uppercase;
    }
    .house-meta span:not([hidden]):not(:empty) + span:not([hidden]):not(:empty)::before {
      content: "·"; margin-right: 10px; opacity: .45;
    }
    #house_zone, #house_id {
      font-size: 10px; letter-spacing: .04em; font-variant-numeric: tabular-nums;
    }
    .tab-bar {
      display: flex; padding: 0 8px;
      border-bottom: 1px solid var(--line);
    }
    .tab {
      flex: 1; background: none; border: 0; border-radius: 0;
      border-bottom: 2px solid transparent;
      color: var(--cream); opacity: .5;
      padding: 11px 6px 9px; margin-bottom: -1px;
      font-size: 13px; font-weight: 500; letter-spacing: .08em;
      cursor: pointer;
    }
    .tab:hover { opacity: .85; }
    .tab.is-active {
      opacity: 1; color: var(--gold); border-bottom-color: var(--gold);
    }
    .wrap {
      display: flex; flex-direction: column; gap: 12px;
      padding: 14px 14px 36px; width: 100%;
    }
    .pane[hidden] { display: none; }
    .pass-sticky {
      position: relative; z-index: 1;
      background: var(--bg); padding-bottom: 6px;
    }
    .pass {
      background: #0e0c0a; border-radius: 16px; overflow: hidden;
      position: relative; padding: 14px 16px 10px;
      border: 1px solid #2c2620;
      box-shadow: 0 10px 24px rgba(0,0,0,.32);
    }
    .pass::before {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(165deg, rgba(196,165,116,.12), transparent 42%, #0e0c0a 88%);
    }
    .pass * { position: relative; }
    .pass h2 {
      margin: 4px 0 0; font-family: Fraunces, Georgia, serif;
      font-size: 22px; font-weight: 500; color: var(--cream);
    }
    .pass .place { letter-spacing: .16em; text-transform: uppercase; font-size: 10px; color: var(--cream); opacity: .85; }
    .badge { display: inline-block; margin: 8px 0 10px; padding: 2px 8px; border-radius: 4px; font-size: 12px; letter-spacing: .04em; }
    .ok { color: var(--cream); } .attention { color: var(--gold); } .alert { color: var(--alert); }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px 10px; }
    .cell .k { font-size: 10px; letter-spacing: .1em; color: var(--cream); text-transform: uppercase; }
    .cell .v { font-size: 15px; margin-top: 1px; }
    .updated { margin-top: 6px; font-size: 10px; color: var(--cream); opacity: .45; letter-spacing: .12em; text-transform: uppercase; }
    #blocks { overflow: visible; }
    .block { background: var(--panel); border-radius: 10px; padding: 7px 12px; margin-top: 6px; border: 1px solid var(--line); }
    .block h3 { margin: 0 0 4px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--cream); font-weight: 600; }
    .row { display: flex; justify-content: space-between; gap: 8px; padding: 2px 0; cursor: pointer; font-size: 13px; }
    .row:hover { color: #fff; }
    .row.active { color: var(--gold); }
    label {
      display: block; font-size: 13px; letter-spacing: 0;
      text-transform: none; color: var(--cream); margin: 8px 0 4px; font-weight: 500;
    }
    input, select, textarea {
      width: 100%; background: #111; color: var(--cream);
      border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font: inherit;
    }
    input:focus, select:focus { outline: 1px solid var(--gold); border-color: var(--gold-deep); }
    input:disabled { opacity: .45; }
    .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
    button { border: 0; border-radius: 8px; padding: 8px 12px; cursor: pointer; font: inherit; }
    button:disabled { opacity: .4; cursor: default; }
    .primary { background: var(--gold); color: var(--ink); font-weight: 600; }
    .ghost { background: transparent; color: var(--cream); border: 1px solid var(--line); }
    .danger { background: transparent; color: #b0897a; border: 1px solid #4a322c; }
    .danger:hover { color: #e4c4b8; border-color: #8a5a4e; }
    .hit { padding: 8px 6px; border-bottom: 1px solid var(--line); cursor: pointer; }
    .hit:hover { background: #151210; }
    .hit .name { font-size: 15px; }
    .hit .live { font-size: 12px; color: var(--cream); opacity: .8; margin-top: 2px; }
    .live { font-size: 13px; color: var(--cream); }
    .status { min-height: 1.2em; color: var(--gold); font-size: 13px; }
    .head-actions .status { min-height: 0; text-align: right; }
    .head-actions .primary { padding: 7px 14px; font-size: 13px; }
    .quiet { color: var(--cream); opacity: .75; font-size: 13px; margin: 0 0 10px; }
    .card-sec {
      background: var(--panel); border-radius: 14px; border: 1px solid var(--line);
      margin-bottom: 8px; overflow: hidden;
    }
    .card-sec.open { border-color: var(--gold-deep); }
    .card-head {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      padding: 10px 12px;
    }
    .card-title {
      flex: 1; min-width: 120px; margin: 0; padding: 0; background: none; border: 0;
      font-family: Fraunces, Georgia, serif; font-size: 18px; font-weight: 500;
      color: var(--cream); text-align: left; cursor: pointer;
    }
    .card-sec.open .card-title { color: var(--gold); }
    .count { font-size: 11px; color: var(--cream); opacity: .55; letter-spacing: .04em; white-space: nowrap; }
    .card-head { flex-wrap: wrap; }
    .card-tools {
      display: flex; align-items: center; gap: 4px;
      flex: 1 0 100%; justify-content: flex-end;
    }
    .card-tools .ghost, .card-tools .danger { padding: 5px 8px; font-size: 12px; }
    .add-cta { border-color: var(--gold-deep) !important; color: var(--gold) !important; }
    .btn-icon { padding: 6px 10px; min-width: 34px; line-height: 1; }
    .card-body { padding: 0 12px 14px; border-top: 1px solid var(--line); }
    .line-wrap { border-bottom: 1px solid var(--line); }
    .line-row {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      padding: 8px 0;
    }
    .pass-check {
      display: inline-flex; align-items: center; gap: 6px; margin: 0;
      text-transform: none; letter-spacing: 0; font-size: 13px; font-weight: 400;
      color: var(--cream); width: auto; cursor: pointer; white-space: nowrap;
    }
    input[type="checkbox"] { width: auto; margin: 0; accent-color: var(--gold); flex: none; }
    .line-label {
      flex: 1; min-width: 88px; width: auto; background: transparent;
      border: 1px solid transparent; padding: 5px 8px; color: var(--cream);
    }
    .line-label:hover { border-color: var(--line); }
    .line-live {
      margin-left: auto; white-space: nowrap; font-variant-numeric: tabular-nums;
      color: var(--cream); min-width: 3em; text-align: right;
    }
    .adv-panel { padding: 8px 0 12px; }
    .card-foot { margin-top: 12px; }
    .confirm-bar {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      margin: 8px 12px 10px; padding: 8px 10px; border: 1px solid var(--alert);
      border-radius: 8px; color: var(--cream);
    }
    .new-card-row, .rename-row {
      display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 8px 0 0;
    }
    .new-card-row input, .rename-row input, .card-title-edit {
      flex: 1; min-width: 140px;
    }
    .add-line-head { margin: 12px 0 6px; font-size: 13px; font-weight: 500; color: var(--cream); }
    .add-line { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .add-line input { flex: 1; min-width: 120px; width: auto; }
    .add-line button { flex: none; }
    .composer .actions { margin-top: 4px; }

    .people-empty { margin: 28px 0 8px; opacity: .7; }
    .people-card {
      background: var(--panel); border: 1px solid var(--line);
      border-radius: 12px; padding: 12px 14px 14px; margin-bottom: 10px;
    }
    .people-card-head {
      display: flex; align-items: center; gap: 8px; margin-bottom: 4px;
    }
    .people-fn {
      flex: 1; min-width: 0; width: auto;
      background: transparent; border: 1px solid transparent; border-radius: 6px;
      padding: 2px 6px 2px 0;
      font-family: Fraunces, Georgia, serif; font-size: 18px; font-weight: 500;
      color: var(--cream);
    }
    .people-fn:hover { border-color: var(--line); }
    .people-fn:focus { outline: none; border-color: var(--gold-deep); }
    .people-tools { display: flex; gap: 6px; flex-wrap: wrap; flex-shrink: 0; }
    .people-field {
      display: grid; grid-template-columns: 4.4em 1fr;
      align-items: center; gap: 8px; margin-top: 8px;
    }
    .people-field .k {
      margin: 0; font-size: 10px; letter-spacing: .12em;
      text-transform: uppercase; font-weight: 500; color: var(--cream); opacity: .65;
    }
    .people-actions { margin-top: 4px; }
    #people_save { display: none; }
    #pane_soon.soon-pane {
      display: flex; flex-direction: column; align-items: stretch;
      gap: 12px; min-height: 0; padding: 0; text-align: left;
    }
    #pane_soon[hidden] { display: none; }
    .soon-sec {
      background: var(--panel); border-radius: 14px; border: 1px solid var(--line);
      padding: 14px 16px 16px;
    }
    .soon-sec h3 {
      margin: 0 0 6px;
      font-family: Fraunces, Georgia, serif;
      font-size: 18px; font-weight: 500; color: var(--cream);
    }
    .soon-still-wrap {
      position: relative;
      background: #0e0c0a; border-radius: 12px; overflow: hidden;
      aspect-ratio: 16 / 10; margin: 8px 0 8px;
      border: 1px solid var(--line);
      display: flex; align-items: center; justify-content: center;
    }
    .soon-still-wrap::after {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      background: linear-gradient(165deg, rgba(196,165,116,.16), transparent 42%, #0e0c0a 88%);
    }
    .soon-still-wrap img {
      position: relative; z-index: 1;
      width: 100%; height: 100%; object-fit: cover; display: block;
    }
    .soon-empty {
      margin: 0; padding: 0; position: relative; z-index: 1;
      font-size: 13px; color: var(--ink); opacity: .55;
    }
    .soon-still-wrap:has(#photo_empty:not([hidden])) {
      background: var(--paper);
    }
    .soon-still-wrap:has(#photo_empty:not([hidden]))::after {
      background: linear-gradient(165deg, rgba(196,165,116,.22), transparent 60%);
    }
    #pair_qr {
      display: block; margin: 12px 0 0;
      background: var(--paper); padding: 14px;
      border-radius: 12px; width: 232px; height: 232px;
    }
    #notes_text { min-height: 8.5em; resize: vertical; }
    input:focus, select:focus, textarea:focus { outline: 1px solid var(--gold); border-color: var(--gold-deep); }
    #pair_qr[hidden] { display: none; }
    .soon-sec .confirm-bar { margin: 10px 0 0; }
  </style>
</head>
<body>
  <div class="chrome">
    <header class="house-bar">
      <div class="house-top">
        <div class="house-brand">
          <svg class="key-mark" viewBox="0 0 12 22" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M6 0C3.79 0 2 1.7 2 3.8c0 .74.24 1.42.64 1.98L2.2 6.6V7.5h1.3V20.2c0 .99.86 1.8 1.9 1.8h2.2c1.04 0 1.9-.81 1.9-1.8V14h2.15c.47 0 .85-.36.85-.8v-1.3c0-.44-.38-.8-.85-.8H9.5v-.85h2.15c.47 0 .85-.36.85-.8V8.15c0-.44-.38-.8-.85-.8H9.5V7.5h1.3V6.6l-.44-.82C10.76 5.22 11 4.54 11 3.8 11 1.7 9.21 0 7 0H6zm0 1.45A2.4 2.4 0 0 1 8.45 3.8 2.4 2.4 0 0 1 6 6.15 2.4 2.4 0 0 1 3.55 3.8 2.4 2.4 0 0 1 6 1.45z"/></svg>
          <span class="wordmark">Patrimony</span>
        </div>
        <div class="head-actions">
          <span class="status" id="status"></span>
          <button class="primary" type="button" id="save">Save</button>
        </div>
      </div>
      <h1 class="house-name" id="house_name">House</h1>
      <p class="house-meta">
        <span id="house_place"></span>
        <span id="house_zone"></span>
        <span id="house_id"></span>
      </p>
    </header>
    <nav class="tab-bar" id="tab_bar" role="tablist">
      <button type="button" class="tab is-active" id="tab_cards" data-tab="cards" role="tab" aria-selected="true">Cards</button>
      <button type="button" class="tab" id="tab_people" data-tab="people" role="tab" aria-selected="false">People</button>
      <button type="button" class="tab" id="tab_soon" data-tab="soon" role="tab" aria-selected="false">Soon</button>
    </nav>
  </div>
  <div class="wrap">
    <div id="pane_cards" class="pane" role="tabpanel">
      <section class="preview">
        <div class="pass-sticky">
          <div class="pass" id="pass"></div>
        </div>
        <div id="blocks"></div>
      </section>
      <section class="composer" id="composer"></section>
    </div>
    <div id="pane_people" class="pane" role="tabpanel" hidden>
      <div id="people_list"></div>
      <div class="actions people-actions">
        <button class="ghost add-cta" type="button" id="people_add">Add person</button>
        <button class="primary" type="button" id="people_save" hidden>Save people</button>
      </div>
      <p class="status" id="people_status"></p>
    </div>
    <div id="pane_soon" class="pane soon-pane" role="tabpanel" hidden>
      <section class="soon-sec" id="soon_photo">
        <h3>Photograph</h3>
        <p class="quiet">The face of the pass.</p>
        <div class="soon-still-wrap" id="photo_wrap">
          <p class="soon-empty" id="photo_empty">No photograph yet.</p>
          <img id="photo_img" alt="House photograph" hidden />
        </div>
        <div class="actions">
          <button class="primary" type="button" id="photo_restore">Restore default</button>
          <button class="ghost" type="button" id="photo_replace">Replace</button>
          <button class="danger" type="button" id="photo_remove" hidden>Remove</button>
          <input type="file" id="photo_file" accept="image/jpeg,image/webp" hidden />
        </div>
        <div class="confirm-bar" id="photo_confirm" hidden>
          <span>Remove this photograph?</span>
          <button class="danger" type="button" id="photo_confirm_yes">Remove</button>
          <button class="ghost" type="button" id="photo_confirm_no">Keep</button>
        </div>
        <p class="status" id="photo_status"></p>
      </section>
      <section class="soon-sec" id="soon_notes">
        <h3>Notepad</h3>
        <p class="quiet">The same page on the phone.</p>
        <textarea id="notes_text" maxlength="8000" placeholder="A quiet note"></textarea>
        <p class="status" id="notes_status"></p>
      </section>
      <section class="soon-sec" id="soon_pair">
        <h3>Pair</h3>
        <p class="quiet">Pairing is in the Patrimony sidebar.</p>
      </section>
      <section class="soon-sec" id="soon_notify">
        <h3>Notify</h3>
        <p class="quiet">A banner on the phone. Attention.</p>
        <input id="notify_title" maxlength="120" placeholder="Guest arriving" />
        <div class="actions">
          <button class="primary" type="button" id="notify_send">Send</button>
        </div>
        <p class="status" id="notify_status"></p>
      </section>
    </div>
  </div>

  <script>
    const MODE = "addon";
    async function api(path, opts) {
      const r = await fetch(path, Object.assign({ credentials: "same-origin" }, opts || {}));
      if (!r.ok) throw new Error(path + " " + r.status);
      return r.json();
    }
    async function apiBinary(path, opts) {
      const r = await fetch(path, Object.assign({ credentials: "same-origin" }, opts || {}));
      return r;
    }
    async function MODE_LOAD() {
      const [h, e] = await Promise.all([api("api/house"), api("api/entities")]);
      houseMeta = h;
      mapping.cards = h.cards || [];
      mapping.mappings = h.mappings || [];
      lastEntities = e.entities || [];
      preview.property = {
        displayName: h.display_name || h.displayName,
        locationLabel: h.location_label || h.locationLabel,
        timezone: h.timezone,
      };
      rebuildLocalPreview();
    }
    async function MODE_SAVE() {
      return api("api/mapping", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          property_id: houseMeta.property_id,
          display_name: houseMeta.display_name || houseMeta.displayName,
          location_label: houseMeta.location_label || houseMeta.locationLabel,
          timezone: houseMeta.timezone,
          cards: cardsForWire(),
          mappings: mapping.mappings,
        }),
      });
    }
    async function MODE_SEARCH(q) {
      if (!lastEntities.length) {
        const e = await api("api/entities");
        lastEntities = e.entities || [];
      }
      return filterHits(lastEntities, q);
    }
    async function MODE_REFRESH() {
      try {
        const e = await api("api/entities");
        lastEntities = e.entities || lastEntities;
      } catch (err) {}
      rebuildLocalPreview();
    }

    const $ = (id) => document.getElementById(id);
    let preview = { property: {}, cards: [] };
    let mapping = { cards: [], mappings: [] };
    let houseMeta = {};
    let selected = null;
    let selectedCardId = null;
    let openAdvId = null;
    let loadFailed = false;
    let saveTimer = null;
    let lastEntities = [];
    let searchTimer = null;
    let addingCard = false;
    let renamingId = null;
    let pendingConfirm = null;

    function newUuid() {
      if (typeof crypto !== "undefined" && typeof crypto.randomUUID === "function") return crypto.randomUUID();
      const b = new Uint8Array(16);
      crypto.getRandomValues(b);
      b[6] = (b[6] & 0x0f) | 0x40;
      b[8] = (b[8] & 0x3f) | 0x80;
      const h = [...b].map(x => x.toString(16).padStart(2, "0")).join("");
      return `${h.slice(0,8)}-${h.slice(8,12)}-${h.slice(12,16)}-${h.slice(16,20)}-${h.slice(20)}`;
    }
    function esc(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
    const badgeText = { ok: "All secure", attention: "Needs a look", alert: "Alert" };
    const rank = { ok: 0, attention: 1, alert: 2 };
    function maxSev(items) {
      return items.reduce((a, i) => (rank[i.severity]||0) > (rank[a]||0) ? i.severity : a, "ok");
    }
    function fmt(item) {
      if (item.value === null || item.value === undefined) return "—";
      if (item.valueType === "bool") return item.value ? "Yes" : "No";
      if (item.valueType === "number") return `${item.value}${item.unit || ""}`;
      return String(item.value);
    }
    function featuredItems(cards) {
      const list = cards || [];
      const featured = [];
      list.forEach(c => (c.items || []).forEach(i => {
        const r = Number(i.featuredRank);
        if (Number.isInteger(r) && r >= 1 && r <= 6) featured.push(i);
      }));
      if (featured.length) {
        featured.sort((a,b) => a.featuredRank - b.featuredRank);
        return featured.slice(0, 6);
      }
      const sorted = [...list].sort((a,b) => (a.priority-b.priority) || String(a.title||"").localeCompare(String(b.title||"")));
      return sorted.flatMap(c => c.items || []).slice(0, 6);
    }
    function sortedCards() {
      return [...(mapping.cards || [])].sort((a,b) => (a.priority-b.priority) || String(a.title||"").localeCompare(String(b.title||"")));
    }
    function currentCard() {
      return (mapping.cards || []).find(c => c.id === selectedCardId) || null;
    }
    function cardsForWire() {
      return (mapping.cards || []).map(c => ({
        id: c.id,
        kind: "custom",
        title: c.title,
        priority: c.priority,
      }));
    }
    function renderPass() {
      const p = preview.property || {};
      const items = featuredItems(preview.cards || []);
      const sev = maxSev((preview.cards || []).flatMap(c => c.items || []));
      $("pass").innerHTML = `
        <div class="place">${esc(p.locationLabel || "")}</div>
        <h2>${esc(p.displayName || "House")}</h2>

              if (!ok) continue;
              const left = j >= 4 && !get(i, j-1) && !get(i, j-2) && !get(i, j-3) && !get(i, j-4);
              const right = j + 10 < size && !get(i, j+7) && !get(i, j+8) && !get(i, j+9) && !get(i, j+10);
              if (left || right) s += 40;
            }
          }
        }
        finderRun((r, c) => mod[r][c] ? 1 : 0);
        finderRun((r, c) => mod[c][r] ? 1 : 0);
        let dark = 0;
        for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) if (mod[y][x]) dark++;
        s += Math.floor(Math.abs(dark * 20 - size * size * 10) / (size * size)) * 10;
        return s;
      }
      let best = null, bestScore = Infinity, bestMask = 0;
      for (let m = 0; m < 8; m++) {
        const masked = applyMask(modules, m);
        drawFormatOn(masked, m);
        const sc = penalty(masked);
        if (sc < bestScore) { bestScore = sc; best = masked; bestMask = m; }
      }
      function drawFormatOn(mod, mask) {
        let dataBits = (FORMAT_BITS[ecl] << 3) | mask;
        let rem = dataBits;
        for (let i = 0; i < 10; i++) rem = (rem << 1) ^ ((rem >>> 9) * 0x537);
        const bits15 = ((dataBits << 10) | rem) ^ 0x5412;
        const coords = [];
        const a = [[0,8],[1,8],[2,8],[3,8],[4,8],[5,8],[7,8],[8,8],[8,7],[8,5],[8,4],[8,3],[8,2],[8,1],[8,0]];
        const b = [[8,size-1],[8,size-2],[8,size-3],[8,size-4],[8,size-5],[8,size-6],[8,size-7],[size-8,8],[size-7,8],[size-6,8],[size-5,8],[size-4,8],[size-3,8],[size-2,8],[size-1,8]];
        for (let i = 0; i < 15; i++) {
          const dark = ((bits15 >>> (14 - i)) & 1) === 1;
          mod[a[i][1]][a[i][0]] = dark;
          mod[b[i][1]][b[i][0]] = dark;
        }
      }
      drawFormatOn(best, bestMask);
      return best;
    }
    function drawPairQr(canvas, text) {
      const matrix = encodeQr(text);
      const n = matrix.length;
      const quiet = 4;
      const dim = n + quiet * 2;
      const scale = Math.max(2, Math.floor(200 / dim));
      canvas.width = dim * scale;
      canvas.height = dim * scale;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#000";
      for (let y = 0; y < n; y++) for (let x = 0; x < n; x++)
        if (matrix[y][x]) ctx.fillRect((x + quiet) * scale, (y + quiet) * scale, scale, scale);
    }

    let photoObjectUrl = null;
    let notesTimer = null;
    let notesReady = false;

    function syncPhotoButtons(mode) {
      const restore = $("photo_restore");
      const replace = $("photo_replace");
      const remove = $("photo_remove");
      if (restore) {
        restore.hidden = mode === "custom";
        restore.className = mode === "custom" ? "ghost" : "primary";
      }
      if (replace) replace.className = "ghost";
      if (remove) remove.hidden = mode !== "custom";
      if ($("photo_confirm") && mode !== "custom") $("photo_confirm").hidden = true;
    }
    async function loadPhoto() {
      const empty = $("photo_empty");
      const img = $("photo_img");
      if (!img) return;
      try {
        const r = await apiBinary(PHOTO_PATH);
        if (r.status === 404) {
          img.hidden = true;
          if (empty) empty.hidden = false;
          if (photoObjectUrl) { URL.revokeObjectURL(photoObjectUrl); photoObjectUrl = null; }
          syncPhotoButtons("empty");
          return;
        }
        if (!r.ok) throw new Error("photo");
        const blob = await r.blob();
        if (photoObjectUrl) URL.revokeObjectURL(photoObjectUrl);
        photoObjectUrl = URL.createObjectURL(blob);
        img.src = photoObjectUrl;
        img.hidden = false;
        if (empty) empty.hidden = true;
        const source = (r.headers.get("X-Patrimony-Photo-Source") || "custom").toLowerCase();
        syncPhotoButtons(source === "default" ? "default" : "custom");
      } catch (e) {
        if ($("photo_status")) $("photo_status").textContent = "Could not load the photograph.";
        syncPhotoButtons("empty");
      }
    }
    async function restorePhoto() {
      $("photo_status").textContent = "Saving…";
      const r = await apiBinary(PHOTO_PATH, { method: "POST" });
      if (!r.ok) { $("photo_status").textContent = "Could not restore."; return; }
      await loadPhoto();
      $("photo_status").textContent = "Restored";
    }
    async function putPhoto(file) {
      const type = file.type === "image/webp" ? "image/webp" : (file.type === "image/jpeg" ? "image/jpeg" : "");
      if (!type) { $("photo_status").textContent = "Use a jpeg or webp."; return; }
      if (file.size > 2 * 1024 * 1024) { $("photo_status").textContent = "Needs to be under 2 MB."; return; }
      $("photo_status").textContent = "Saving…";
      const buf = await file.arrayBuffer();
      const r = await apiBinary(PHOTO_PATH, { method: "PUT", headers: { "Content-Type": type }, body: buf });
      if (!r.ok) { $("photo_status").textContent = "Could not save."; return; }
      await loadPhoto();
      $("photo_status").textContent = "Saved";
    }
    async function removePhoto() {
      $("photo_status").textContent = "Saving…";
      const r = await apiBinary(PHOTO_PATH, { method: "DELETE" });
      if (r.status !== 204 && r.status !== 404) { $("photo_status").textContent = "Could not remove."; return; }
      const empty = $("photo_empty");
      const img = $("photo_img");
      if (img) img.hidden = true;
      if (empty) empty.hidden = false;
      if (photoObjectUrl) { URL.revokeObjectURL(photoObjectUrl); photoObjectUrl = null; }
      syncPhotoButtons("empty");
      $("photo_status").textContent = "Removed";
    }
    async function loadNotes() {
      notesReady = false;
      try {
        const doc = await api(NOTES_PATH);
        if ($("notes_text")) $("notes_text").value = doc.text || "";
        if ($("notes_status")) $("notes_status").textContent = doc.updatedAt ? "Saved" : "";
      } catch (e) {
        if ($("notes_status")) $("notes_status").textContent = "Could not load notes";
      }
      notesReady = true;
    }
    async function saveNotesNow() {
      if (!notesReady) return;
      const text = ($("notes_text") && $("notes_text").value) || "";
      if ($("notes_status")) $("notes_status").textContent = "Saving…";
      try {
        await api(NOTES_PATH, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ schemaVersion: 1, text }),
        });
        if ($("notes_status")) $("notes_status").textContent = "Saved";
      } catch (e) {
        if ($("notes_status")) $("notes_status").textContent = "Save failed";
      }
    }
    function scheduleNotes() {
      if (!notesReady) return;
      if ($("notes_status")) $("notes_status").textContent = "Saving…";
      clearTimeout(notesTimer);
      notesTimer = setTimeout(saveNotesNow, 600);
    }
    function clearPairing() {
      const canvas = $("pair_qr");
      if (canvas) {
        canvas.hidden = true;
        const ctx = canvas.getContext && canvas.getContext("2d");
        if (ctx) ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
      if ($("pair_dismiss")) $("pair_dismiss").hidden = true;
    }
    async function showPairing() {
      if ($("pair_status")) $("pair_status").textContent = "";
      try {
        const r = await apiBinary(PAIR_PATH, { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
        if (r.status === 403) {
          if ($("pair_status")) $("pair_status").textContent = "An admin can show a pairing code.";
          clearPairing();
          return;
        }
        if (!r.ok) {
          if ($("pair_status")) $("pair_status").textContent = "Pairing is unavailable.";
          return;
        }
        const body = await r.json();
        const uri = body && body.pairing;
        if (!uri) { if ($("pair_status")) $("pair_status").textContent = "Pairing is unavailable."; return; }
        const canvas = $("pair_qr");
        drawPairQr(canvas, uri);
        canvas.hidden = false;
        if ($("pair_dismiss")) $("pair_dismiss").hidden = false;
      } catch (e) {
        if ($("pair_status")) $("pair_status").textContent = "Pairing is unavailable.";
      }
    }
    async function loadNotifyConfig() {
      try {
        const doc = await api(NOTIFY_PATH);
        const on = !!(doc && doc.configured);
        if ($("notify_send")) $("notify_send").disabled = !on;
        if ($("notify_title")) $("notify_title").disabled = !on;
        if (!on && $("notify_status")) $("notify_status").textContent = "Push needs the house event key.";
        else if ($("notify_status") && $("notify_status").textContent === "Push needs the house event key.") $("notify_status").textContent = "";
      } catch (e) {
        if ($("notify_send")) $("notify_send").disabled = true;
        if ($("notify_status")) $("notify_status").textContent = "Push needs the house event key.";
      }
    }
    async function sendNotify() {
      const title = (($("notify_title") && $("notify_title").value) || "").trim();
      if (!title) { if ($("notify_status")) $("notify_status").textContent = "Write a short title."; return; }
      if ($("notify_status")) $("notify_status").textContent = "Sending…";
      try {
        const r = await apiBinary(NOTIFY_PATH, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ title: title.slice(0, 120) }),
        });
        const body = await r.json().catch(() => ({}));
        if (r.ok && body && body.ok) {
          if ($("notify_status")) $("notify_status").textContent = "Sent";
          if ($("notify_title")) $("notify_title").value = "";
          return;
        }
        if (body && body.error && body.error.code === "missing_house_event_key") {
          if ($("notify_send")) $("notify_send").disabled = true;
          if ($("notify_status")) $("notify_status").textContent = "Push needs the house event key.";
          return;
        }
        if ($("notify_status")) $("notify_status").textContent = "Could not send.";
      } catch (e) {
        if ($("notify_status")) $("notify_status").textContent = "Could not send.";
      }
    }
    async function loadSoon() {
      await Promise.all([loadPhoto(), loadNotes(), loadNotifyConfig()]);
    }
    function bindSoon() {
      if ($("photo_restore")) $("photo_restore").onclick = restorePhoto;
      if ($("photo_replace")) $("photo_replace").onclick = () => $("photo_file") && $("photo_file").click();
      if ($("photo_file")) $("photo_file").onchange = () => {
        const f = $("photo_file").files && $("photo_file").files[0];
        $("photo_file").value = "";
        if (f) putPhoto(f);
      };
      if ($("photo_remove")) $("photo_remove").onclick = () => {
        if ($("photo_confirm")) $("photo_confirm").hidden = false;
      };
      if ($("photo_confirm_yes")) $("photo_confirm_yes").onclick = () => {
        if ($("photo_confirm")) $("photo_confirm").hidden = true;
        removePhoto();
      };
      if ($("photo_confirm_no")) $("photo_confirm_no").onclick = () => {
        if ($("photo_confirm")) $("photo_confirm").hidden = true;
      };
      if ($("notes_text")) $("notes_text").addEventListener("input", scheduleNotes);
      if ($("pair_show")) $("pair_show").onclick = showPairing;
      if ($("pair_dismiss")) $("pair_dismiss").onclick = () => { clearPairing(); if ($("pair_status")) $("pair_status").textContent = ""; };
      if ($("notify_send")) $("notify_send").onclick = sendNotify;
    }
    bindSoon();
    document.querySelectorAll(".tab").forEach((btn) => {
      btn.onclick = () => showTab(btn.dataset.tab);
    });
    $("save").onclick = () => {
      if (activeTab === "people") {
        savePeople().catch(() => {
          $("people_status").textContent = "Save failed";
          $("status").textContent = "Save failed";
          $("status").style.color = "var(--alert)";
        });
      } else if (activeTab === "cards") {
        doSave();
      }
    };
    showTab("cards");
    load();
    setInterval(async () => { if (saveTimer) return; try { await MODE_REFRESH(); } catch (e) {} }, 4000);
  </script>
</body>
</html>
